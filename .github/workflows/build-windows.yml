# This workflow has been superseded by release.yml which builds all platforms.
# Kept here as reference only — the 'on:' trigger is intentionally removed.
name: Build Windows (DISABLED — see release.yml)

on:
  workflow_dispatch:
    inputs:
      disabled:
        description: 'This workflow is disabled. Use release.yml instead.'
        required: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Rust stable (Windows target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './web/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build .NET sidecar for Windows x64
        shell: bash
        run: |
          dotnet publish API -c Release -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o API/publish-win
          mkdir -p web/src-tauri/binaries
          cp API/publish-win/API.exe \
            "web/src-tauri/binaries/api-server-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri app (Windows MSI + NSIS)
        working-directory: web
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: deployvare-windows-msi
          path: web/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: deployvare-windows-nsis
          path: web/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn
